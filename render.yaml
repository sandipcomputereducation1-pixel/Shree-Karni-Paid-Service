services:
  - type: web
    name: shree-karni-paid-service
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPI_ID
        sync: false
      - key: UPI_NAME
        value: Shree Karni Computer
      - key: DB_PATH
        value: /var/data/shree_karni.db
    disk:
      name: shree-karni-data
      mountPath: /var/data
      sizeGB: 1
